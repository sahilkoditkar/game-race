name: Deploy to GitHub Pages

# GitHub Pages is currently configured to deploy from the `main` branch directly
# (Settings -> Pages -> "Deploy from a branch"), so this workflow is manual-only.
# Switch the Pages source to "GitHub Actions" and re-add a `push` trigger if you
# would rather deploy through Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
